# Publishes the clawmessenger CLI (packages/xiachat-cli) as standalone Node SEA
# executables via GitHub Releases.
#
# Trigger: pushing a tag named clawmessenger-v*.*.* (for example
# clawmessenger-v0.1.0). This deliberately avoids the main release.yml trigger
# (v*.*.*) so the CLI can ship independently from the server/web/desktop
# release train.
#
# The SEA build copies the build machine's node binary into the executable,
# so cross-compilation is impossible — each target needs its own runner.
name: clawmessenger release

on:
  push:
    tags:
      - "clawmessenger-v*.*.*"

permissions:
  contents: write

concurrency:
  group: clawmessenger-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.name }})
    # Guard against forks of this repository running the release pipeline.
    if: github.repository == 'clawmessenger/claw-messenger'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            artifact: clawmessenger-windows-x64.exe
            source: dist/clawmessenger.exe
          - os: ubuntu-latest
            name: linux-x64
            artifact: clawmessenger-linux-x64
            source: dist/clawmessenger
          - os: ubuntu-24.04-arm
            name: linux-arm64
            artifact: clawmessenger-linux-arm64
            source: dist/clawmessenger
          # darwin-x64 (Intel) dropped: GitHub retired the macos-13 Intel
          # runners, so that matrix entry queues forever. Intel Macs are not
          # supported (pre-2020 machines); modern Macs use darwin-arm64.
          - os: macos-latest
            name: darwin-arm64
            artifact: clawmessenger-darwin-arm64
            source: dist/clawmessenger
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The exe reports its own version to the server, which stores it in the
      # admin device list and uses it to decide "already up to date". So the
      # version baked into the binary MUST be the tag version — if it falls back
      # to package.json instead, every device that upgrades to 1.3.0 keeps
      # reporting 1.2.0, the post-restart check reports failed/restart_failed,
      # and the admin page shows the update as broken while it actually worked.
      # Strip the `clawmessenger-v` prefix (tag = clawmessenger-v1.3.0).
      # A tag that does not match the expected shape fails the job instead of
      # silently falling back to package.json — the whole point of this step is
      # that the version inside the binary is derived from the tag, never
      # guessed. `GITHUB_REF_NAME` is `clawmessenger-v1.3.0` here (see `on.push.tags`).
      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#clawmessenger-v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag '$tag' is not clawmessenger-v<major>.<minor>.<patch>"
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "building clawmessenger $version (tag $tag)"

      - name: Build SEA executable
        env:
          CLAWMESSENGER_VERSION: ${{ steps.version.outputs.value }}
        run: pnpm --filter @quukk/xiachat-cli build:exe

      # Gate 1, on the entry bundle: deterministic and side-effect free (plain
      # node, runs the same injected constant the SEA blob carries). Fails fast
      # before the slower executable is assembled.
      #
      # 取版本号用「按 semver 形状挑行」而不是 `tail -n1`：产物首次运行时会在版本号
      # 之后追加自安装通知，`tail -n1` 拿到的是通知文本，会把正确的包判成版本不对。
      # 通知现在改走 stderr（packages/xiachat-cli/src/bin.ts），这里仍然两道保险。
      #
      # 采集方式必须是「重定向到文件」，不能是 `raw="$( ... )"`。命令替换在 POSIX 上
      # 把 stdout 接到**管道**，而 Node 的 process.stdout 接管道时是异步写、接文件时
      # 是同步写：异步写会在进程退出时丢掉尚未落地的数据，而 stderr 恰好是同步的
      # ——于是只有 stdout 丢，命令替换拿到空串、退出码仍然是 0，闸门把一份完全正确
      # 的产物判成「版本号不对」。v1.3.0 第一次打 tag 就是这么被拦下的：同一份脚本
      # windows-x64 通过，linux-x64 / linux-arm64 / darwin-arm64 全部上报空版本号。
      - name: Verify the bundle reports the tag version
        shell: bash
        env:
          EXPECTED: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          bundle="packages/xiachat-cli/dist/clawmessenger.sea.cjs"
          if [[ ! -f "$bundle" ]]; then
            echo "::error::build:exe did not produce $bundle"
            exit 1
          fi
          out="$RUNNER_TEMP/bundle-version.out"
          err="$RUNNER_TEMP/bundle-version.err"
          # 失败现场要能直接从注解里读到：注解在任何视图都可见，日志得登进去翻。
          # 注解里的换行必须写成 %0A、字面 % 必须写成 %25（GitHub 的转义规则）。
          flatten() {
            awk 'NR <= 12 { gsub(/\r/, ""); gsub(/%/, "%25"); if (NR > 1) printf "%s", "%0A"; printf "%s", $0 }' "$1" 2>/dev/null || true
          }
          dump_io() {
            echo "---- stdout ----"
            sed 's/^/  stdout> /' "$out" || true
            echo "---- stderr ----"
            sed 's/^/  stderr> /' "$err" || true
          }
          # `|| rc=$?` 而不是 `set +e` 再 `set -e`：后者漏一行就会把后续命令的失败
          # 一起吞掉。set -e 下 rc 的赋值不会中断脚本。
          rc=0
          node "$bundle" --version >"$out" 2>"$err" || rc=$?
          actual="$(tr -d '\r' <"$out" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | tail -n1 || true)"
          echo "bundle: $bundle ($(wc -c <"$bundle" | tr -d ' ') bytes)"
          echo "node: $(node --version) at $(command -v node || echo '<missing>')"
          echo "bundle --version -> '$actual' (tag says '$EXPECTED'), exit=$rc"
          if [[ "$rc" != "0" ]]; then
            dump_io
            echo "::error::the built bundle exited $rc when asked for --version. node=$(node --version) stdout=$(flatten "$out") stderr=$(flatten "$err")"
            exit 1
          fi
          if [[ "$actual" != "$EXPECTED" ]]; then
            dump_io
            echo "::error::the built bundle reports '$actual' but the tag is '$EXPECTED' — refusing to publish a mislabelled release. stdout=$(flatten "$out") stderr=$(flatten "$err")"
            exit 1
          fi

      # Gate 2, on the exact file that gets published: run it. This is the only
      # check that proves the *shipped* bytes answer `--version` with the tag —
      # `--version` is handled before any command action, so it cannot install
      # or mutate anything (`ensureInstalled` is best-effort and only copies the
      # binary), and `matrix.source` is the built artifact path
      # (dist/clawmessenger.exe on Windows, dist/clawmessenger elsewhere).
      #
      # 采集方式与 Gate 1 相同：重定向到文件，不用命令替换（见上面的注释）。
      - name: Verify embedded version
        shell: bash
        env:
          EXPECTED: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          artifact="packages/xiachat-cli/${{ matrix.source }}"
          if [[ ! -f "$artifact" ]]; then
            echo "::error::$artifact was not produced by build:exe"
            exit 1
          fi
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            chmod +x "$artifact"
          fi
          out="$RUNNER_TEMP/exe-version.out"
          err="$RUNNER_TEMP/exe-version.err"
          flatten() {
            awk 'NR <= 12 { gsub(/\r/, ""); gsub(/%/, "%25"); if (NR > 1) printf "%s", "%0A"; printf "%s", $0 }' "$1" 2>/dev/null || true
          }
          dump_io() {
            echo "---- stdout ----"
            sed 's/^/  stdout> /' "$out" || true
            echo "---- stderr ----"
            sed 's/^/  stderr> /' "$err" || true
          }
          # 退出码也是闸门的一部分：`--version` 是成功路径，非 0 就是 bug
          # （`.exitOverride()` 抛的 CommanderError 没被入口翻译时就是这个症状：
          # 版本号打印正确，进程却 exit 1 并把版本号重复打到 stderr）。
          rc=0
          "$artifact" --version >"$out" 2>"$err" || rc=$?
          actual="$(tr -d '\r' <"$out" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | tail -n1 || true)"
          echo "$artifact --version -> '$actual' (tag says '$EXPECTED'), exit=$rc"
          if [[ "$rc" != "0" ]]; then
            dump_io
            echo "::error::'$artifact --version' exited $rc — the version gate reads that output, and a non-zero exit also means the binary rejects a flag it should accept. stdout=$(flatten "$out") stderr=$(flatten "$err")"
            exit 1
          fi
          if [[ "$actual" != "$EXPECTED" ]]; then
            dump_io
            echo "::error::${{ matrix.source }} reports '$actual' but the tag is '$EXPECTED' — refusing to publish a mislabelled release. stdout=$(flatten "$out") stderr=$(flatten "$err")"
            exit 1
          fi

      - name: Stage artifact
        shell: bash
        run: |
          set -euo pipefail
          ls -l packages/xiachat-cli/dist
          mv "packages/xiachat-cli/${{ matrix.source }}" "${{ matrix.artifact }}"
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            chmod +x "${{ matrix.artifact }}"
          fi
          ls -l "${{ matrix.artifact }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create GitHub release
    needs: build
    if: github.repository == 'clawmessenger/claw-messenger'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # Windows users get the background-daemon wrapper next to the exe, so the
      # agents can stay online without a foreground console window.
      - name: Bundle Windows daemon scripts
        shell: bash
        run: |
          set -euo pipefail
          zip -9 -j artifacts/clawmessenger-windows-x64-daemon-scripts.zip \
            packages/xiachat-cli/scripts/win/clawmessenger-daemon.ps1 \
            packages/xiachat-cli/scripts/win/clawmessenger-daemon.cmd
          unzip -l artifacts/clawmessenger-windows-x64-daemon-scripts.zip

      # Linux/macOS users get the same capability: a daemon wrapper that detaches
      # from the shell (nohup/setsid) and can register a systemd service.
      - name: Bundle Linux/macOS daemon scripts
        shell: bash
        run: |
          set -euo pipefail
          chmod +x packages/xiachat-cli/scripts/linux/clawmessenger-daemon.sh
          tar -czf artifacts/clawmessenger-linux-daemon-scripts.tar.gz \
            -C packages/xiachat-cli/scripts/linux clawmessenger-daemon.sh
          tar -tzvf artifacts/clawmessenger-linux-daemon-scripts.tar.gz

      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum clawmessenger-* | tee SHA256SUMS

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES="$(printf 'Standalone clawmessenger CLI builds (Node SEA executables).\n\nDownload the binary for your platform from the assets below; see SHA256SUMS for checksums. Windows: clawmessenger-windows-x64.exe (rename to clawmessenger.exe if you like). macOS/Linux: chmod +x before first run.\n\nWindows only: clawmessenger-windows-x64-daemon-scripts.zip keeps the agents running in the background, so closing the console no longer takes them offline. Unzip next to the exe and run `clawmessenger-daemon.cmd start` (also: stop / restart / status / logs / install-startup / install / uninstall).\n\nLinux/macOS: clawmessenger-linux-daemon-scripts.tar.gz does the same -- the agents stay online after you close the shell. Untar and run `./clawmessenger-daemon.sh start`; `install-service` registers a systemd unit (boot start + crash restart). Also: stop / restart / status / logs / uninstall.\n\n'; cat artifacts/SHA256SUMS)"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "clawmessenger ${TAG#clawmessenger-v}" \
            --notes "$NOTES" \
            artifacts/*
